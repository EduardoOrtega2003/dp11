; Tamaños máximos de subida 
upload_max_filesize = 200M
post_max_size = 200M

; Límite de memoria para scripts PHP
memory_limit = 512M

; Tiempo máximo de ejecución 
max_execution_time = 120
max_input_time = 60

; Mostrar errores (útil en desarrollo)
display_errores = On
display_startup_errores = On 
error_reporting = E_ALL

; Ajustar timezone (opcional)
date.timezone = Europe/Madrid
